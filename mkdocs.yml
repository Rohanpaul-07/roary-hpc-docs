site_name: Roary HPC Documentation
site_description: FIU Research Computing - Roary High Performance Computing User Guide
site_author: FIU Research Computing

theme:
  name: material

  language: en

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow

    - search.suggest
    - search.highlight
    - search.share

    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    logo: material/server-network
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

copyright: >
  FIU Research Computing &nbsp;•&nbsp; Roary High Performance Computing

